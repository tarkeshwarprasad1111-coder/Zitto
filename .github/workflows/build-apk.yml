name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# The Android project is generated rather than committed: `cap add android`
# scaffolds it from capacitor.config.ts on every run, so there is no large
# generated tree in git and no chance of it drifting from the config.
jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # `shell: bash` matters on every step that pipes to tee: it turns on
      # pipefail, so the step's exit status is the command's and not tee's.
      # Without it a failed build reports success and the error only surfaces
      # three steps later as something unrelated.
      - name: Build static export
        working-directory: apps/web
        shell: bash
        run: pnpm build:mobile 2>&1 | tee ../../next-build.log

      - name: Verify the export produced something
        working-directory: apps/web
        shell: bash
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::next build finished but out/index.html is missing."
            exit 1
          fi
          echo "Exported $(find out -name '*.html' | wc -l) pages."

      # A build that ships raw `@tailwind` directives produces an APK of
      # unstyled HTML while every step reports success. That shipped once;
      # this makes it impossible to ship again.
      - name: Verify Tailwind compiled
        working-directory: apps/web
        shell: bash
        run: |
          CSS=$(find out/_next/static/css -name '*.css' 2>/dev/null | head -1)

          if [ -z "$CSS" ]; then
            echo "::error::No stylesheet was emitted."
            exit 1
          fi

          if grep -q '@tailwind\|@apply' "$CSS"; then
            echo "::error::$CSS still contains @tailwind/@apply — the Tailwind PostCSS plugin did not run."
            head -c 400 "$CSS"
            exit 1
          fi

          SIZE=$(wc -c < "$CSS")
          if [ "$SIZE" -lt 15000 ]; then
            echo "::error::Stylesheet is only ${SIZE} bytes. Tailwind emitted almost nothing — check the content globs in tailwind.config.ts."
            exit 1
          fi

          echo "Stylesheet compiled: ${SIZE} bytes."

      # Three separate dead links have shipped so far — /profile/wallet,
      # /notifications and /tournaments/:id — each a 404 reachable from the
      # main navigation. A link to a route the export never emitted is a
      # build error, not something to find by hand on a phone.
      - name: Check every internal link resolves
        working-directory: apps/web
        shell: bash
        run: |
          MISSING=0

          # Literal hrefs only. Template-literal links carry runtime values
          # and cannot be resolved here; their parent routes still get checked.
          LINKS=$(grep -rhoE 'href="/[a-zA-Z0-9/_-]*"' src --include='*.tsx' \
                  | sed 's|href="||; s|"||' | sort -u)

          for link in $LINKS; do
            [ "$link" = "/" ] && continue
            path="out${link%/}"
            if [ ! -f "${path}/index.html" ] && [ ! -f "${path}.html" ]; then
              echo "::error::$link is linked but was never exported."
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "Exported routes:"
            find out -name index.html | sed 's|^out||; s|/index.html||' | sort
            exit 1
          fi

          echo "All internal links resolve."

      - name: Scaffold Android project
        working-directory: apps/web
        shell: bash
        run: pnpm exec cap add android 2>&1 | tee -a ../../next-build.log

      - name: Generate launcher icons and splash
        working-directory: apps/web
        shell: bash
        # Non-fatal on purpose: a missing launcher icon is cosmetic, and
        # failing here would stop us finding out whether the APK itself builds.
        run: pnpm exec capacitor-assets generate --android 2>&1 | tee -a ../../next-build.log || true

      - name: Sync web assets into the Android project
        working-directory: apps/web
        shell: bash
        run: pnpm exec cap sync android 2>&1 | tee -a ../../next-build.log

      - name: Assemble debug APK
        id: assemble
        working-directory: apps/web/android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../../../gradle.log
        continue-on-error: true

      # Always published, pass or fail. Reading a build log beats guessing at
      # an exit code, which is exactly how the last Android build stalled.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            next-build.log
            gradle.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Zitto-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail if the APK did not build
        if: steps.assemble.outcome == 'failure'
        run: |
          echo "::error::Gradle failed. Download the build-logs artifact for the reason."
          exit 1
