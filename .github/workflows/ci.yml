name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm` until a lockfile is committed. setup-node builds
          # its cache key by hashing pnpm-lock.yaml, and with no lockfile the
          # step fails outright — which is what took down lint, test and the
          # security scan together.

      # --no-frozen-lockfile until pnpm-lock.yaml is committed; the strict
      # flag refuses to run at all when the lockfile is absent.
      - run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zitto/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  language-guardrails:
    name: Prediction language guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Any of these phrases in user-facing copy would misrepresent what the
      # analytics can do, so the build fails rather than shipping them.
      - name: Scan for prohibited claims
        run: |
          BANNED='guaranteed win|sure shot|100% accurate|100% win|fixed result|sure prediction|double your money|recover your loss|guaranteed profit'
          # The two files that declare the ban, and the tests that exercise
          # it, necessarily contain every phrase. Without these exclusions the
          # check can never pass — and a permanently red guardrail is worse
          # than none, because people stop reading it.
          if grep -rEin "$BANNED" \
              --include='*.ts' --include='*.tsx' --include='*.json' \
              --include='*.md' --include='*.html' \
              --exclude='prohibited-phrases.ts' --exclude='disclaimers.ts' \
              --exclude='*.spec.ts' --exclude='*.test.ts' \
              apps packages 2>/dev/null; then
            echo "::error::Prohibited prediction language found. See matches above."
            exit 1
          fi
          echo "No prohibited prediction language found."

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zitto
          POSTGRES_PASSWORD: zitto_test
          POSTGRES_DB: zitto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zitto:zitto_test@localhost:5432/zitto_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm` until a lockfile is committed. setup-node builds
          # its cache key by hashing pnpm-lock.yaml, and with no lockfile the
          # step fails outright — which is what took down lint, test and the
          # security scan together.

      # --no-frozen-lockfile until pnpm-lock.yaml is committed; the strict
      # flag refuses to run at all when the lockfile is absent.
      - run: pnpm install --no-frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @zitto/api exec prisma migrate deploy

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, language-guardrails]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm` until a lockfile is committed. setup-node builds
          # its cache key by hashing pnpm-lock.yaml, and with no lockfile the
          # step fails outright — which is what took down lint, test and the
          # security scan together.

      # --no-frozen-lockfile until pnpm-lock.yaml is committed; the strict
      # flag refuses to run at all when the lockfile is absent.
      - run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zitto/api prisma:generate

      - name: Build all apps
        run: pnpm build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm` until a lockfile is committed. setup-node builds
          # its cache key by hashing pnpm-lock.yaml, and with no lockfile the
          # step fails outright — which is what took down lint, test and the
          # security scan together.

      # --no-frozen-lockfile until pnpm-lock.yaml is committed; the strict
      # flag refuses to run at all when the lockfile is absent.
      - run: pnpm install --no-frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          if grep -rEn "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
              --include='*.ts' --include='*.tsx' --include='*.json' \
              apps packages 2>/dev/null; then
            echo "::error::Possible hardcoded secret detected."
            exit 1
          fi
          echo "No hardcoded secrets detected."
